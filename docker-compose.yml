services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: maisxml-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    environment:
      # Values come from project `.env` (Compose substitutes ${VAR} from that file).
      # Default connects to the bundled `mysql` service. Override DB_HOST in `.env` for a remote DB.
      DB_CONNECTION: '${DB_CONNECTION:-mysql}'
      DB_HOST: '${DB_HOST:-mysql}'
      DB_PORT: '${DB_PORT:-3306}'
      DB_DATABASE: '${DB_DATABASE:-maisxml}'
      DB_USERNAME: '${DB_USERNAME:-maisxml}'
      DB_PASSWORD: '${DB_PASSWORD:-maisxml}'
      REDIS_HOST: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - maisxml

  nginx:
    image: nginx:alpine
    container_name: maisxml-nginx
    restart: unless-stopped
    ports:
      - '${APP_PORT:-8080}:80'
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - maisxml

  mysql:
    image: mysql:8.0
    container_name: maisxml-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: '${DB_DATABASE:-maisxml}'
      MYSQL_USER: '${DB_USERNAME:-maisxml}'
      MYSQL_PASSWORD: '${DB_PASSWORD:-maisxml}'
      MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD:-root}'
    volumes:
      - maisxml-mysql-data:/var/lib/mysql
    ports:
      - '${MYSQL_PORT:-33060}:3306'
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" || exit 1']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - maisxml

  redis:
    image: redis:7-alpine
    container_name: maisxml-redis
    restart: unless-stopped
    networks:
      - maisxml

  worker:
    profiles:
      - worker
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: maisxml-worker
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    environment:
      DB_CONNECTION: '${DB_CONNECTION:-mysql}'
      DB_HOST: '${DB_HOST:-mysql}'
      DB_PORT: '${DB_PORT:-3306}'
      DB_DATABASE: '${DB_DATABASE:-maisxml}'
      DB_USERNAME: '${DB_USERNAME:-maisxml}'
      DB_PASSWORD: '${DB_PASSWORD:-maisxml}'
      REDIS_HOST: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    command: ['php', 'artisan', 'queue:work', 'redis', '--sleep=3', '--tries=3', '--max-time=3600']
    depends_on:
      - mysql
      - redis
    networks:
      - maisxml

networks:
  maisxml:
    driver: bridge

volumes:
  maisxml-mysql-data:
